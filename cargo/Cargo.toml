# Global Cargo binaries manifest.
#
# Reproducibly install every globally-needed Rust tool with one command:
#
#   cargo install --locked --force --path ~/.dotfiles/cargo
#
# (The manifest file is named Cargo.toml because that's what cargo looks for
# when installing from a path.)
#
# Why a manifest instead of bare `cargo install <tool>` calls:
#   - the full set of global tools is version-controlled here alongside the
#     rest of the dotfiles, so a fresh machine converges in one command
#   - `--locked` keeps the resolved versions pinned to Cargo.lock (committed)
#   - cargo's own ~/.cargo/.crates.toml / .crates2.json are NOT tracked —
#     they are derived state managed by cargo itself, this manifest is the
#     source of truth.
#
# `nu` is intentionally included (it is a cargo install, not a rustup toolchain).
#
# `markdown-oxide` is installed from git (not on crates.io); see below.
[package]
name = "cargo-global"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false
autoexamples = false
tests = false

[lib]
path = "src/lib.rs"

[dependencies]
leptosfmt = "0.1"
lumis-cli = "0.4"
nu        = "0.114"

# markdown-oxide is NOT published to crates.io — install from git.
# Pin to a specific rev so installs are reproducible. Bump by running
# `cargo update -p markdown-oxide` after confirming a new upstream release.
markdown-oxide = { git = "https://github.com/Feel-ix-343/markdown-oxide.git", branch = "main" }
