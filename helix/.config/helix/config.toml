theme = "onedarkpro"

[editor]
line-number = "absolute"
mouse = false
shell = ["bash", "-c"]
auto-format = true

[editor.auto-save]
after-delay = { enable = true }

[keys.normal]
C-g = [
  ":write-all",
  ":insert-output lazygit >/dev/tty",
  ":redraw",
  ":reload-all"
]

[keys.insert]
j = { k = "normal_mode" }

[keys.normal.space]
m = [
  ':insert-output glow -p -w %sh{stty size </dev/tty | cut -d" " -f2} "%{buffer_name}" >/dev/tty',
  ':redraw',
]
e = [
  ':sh rm -f /tmp/unique-file-h21a434',
  ':insert-output spf --chooser-file=/tmp/unique-file-h21a434 "%sh{bn="%{buffer_name}"; if [ -f "$bn" ]; then dirname "$bn"; else pwd; fi}" >/dev/tty',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file-h21a434}',
  ':redraw',
]
